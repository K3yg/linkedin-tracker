[project]
name = "linkedin-tracker"
version = "0.1.0"
description = "Local LinkedIn job watcher + application tracker"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "selectolax>=0.3",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "winotify>=1.1; sys_platform == 'win32'",
    "google-genai>=2.28.0",
    "pypdf>=6.19.0",
]

[tool.uv]
package = false
